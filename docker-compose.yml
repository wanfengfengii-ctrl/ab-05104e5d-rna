services:
  api:
    build: .
    image: rna-fold-adjudicator:latest
    # 宿主机端口可通过环境变量 HOST_PORT 配置，默认 8080。
    # 例如：HOST_PORT=9090 docker compose up
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2); sys.exit(0 if r.status==200 and json.load(r)['status']=='ok' else 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # 一次性验收服务：等待 API 健康后执行验收用例，输出报告并退出（exit 0/1）。
  # 随栈自动运行；也可单独执行：docker compose run --rm acceptance
  acceptance:
    build: .
    image: rna-fold-adjudicator:latest
    command: ["python", "-m", "scripts.acceptance"]
    environment:
      API_BASE_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
